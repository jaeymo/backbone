[package]
name = "jaeymo/backbone"
description = "A medium-weight game framework, the backbone of your project!"
version = "0.1.0"
exclude = ["**"]
include = ["lib", "lib/**", "wally.toml", "wally.lock", "default.project.json", "LICENSE", "README.md"]
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
Promise = "howmanysmall/typed-promise@4.0.6"
Janitor = "howmanysmall/janitor@1.18.3"
Signal = "sleitnick/signal@2.0.3"
Classy = "jaeymo/classy@2.1.2"